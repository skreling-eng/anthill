[project]
name = "anthill"
version = "0.1.0"
description = ".ah agentic system language interpreter"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub>=0.34.0,<1.0",
    "llama-cpp-python>=0.3.0",
    "pywebview>=5.0",
]

# Optional: uv pip install moviepy  (for $image_clip / $video_clip audio mux)
# $music (safetensors): uv sync --extra music  (installs ace-step from GitHub)

[project.optional-dependencies]
clip = ["moviepy>=2.0"]
sound2text = [
    "openai-whisper>=20231117",
]
music = [
    "ace-step",
]
music_separation = [
    "openvino>=2024.0",
    "numpy",
    "scipy",
    "soundfile",
    "huggingface-hub",
    "audio-separator[cpu]>=0.44.0",
]
text2speech = [
    "kokoro>=0.9.4",
    "soundfile>=0.12",
    "torch>=2.1",
    "numpy",
]
# spaCy en_core_web_sm: installed by tools/setup_external_venvs.ps1 (not on PyPI as a normal dep)
# voice_enhance: isolated .venvs/voice_enhance (resemble-enhance pins torch==2.1.1) — see tools/setup_external_venvs.ps1
# change_voice: isolated .venvs/change_voice (Python 3.10 + rvc-python) — see tools/setup_external_venvs.ps1
image = [
    "torch==2.7.1",
    "torchvision",
    "torchaudio==2.7.1",
    "bitsandbytes>=0.43.0",
    "diffusers>=0.37.0",
    "transformers>=4.57.0",
    "huggingface-hub>=0.34.0,<1.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
    "compel>=2.0.0",
    "protobuf>=4.25.0",
    "sentencepiece>=0.2.0",
    "peft>=0.13.0",
    "pillow>=10.0.0",
]
image2video = [
    "torch==2.7.1",
    "torchvision",
    "torchaudio==2.7.1",
    "ftfy>=6.1",
    "sageattention>=1.0.6",
    "diffusers>=0.37.0",
    "transformers>=4.57.0",
    "huggingface-hub>=0.34.0,<1.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
]
image2video-fast = [
    "torch==2.7.1",
    "torchvision",
    "torchaudio==2.7.1",
    "ftfy>=6.1",
    "sageattention>=1.0.6",
    "diffusers>=0.37.0",
    "transformers>=4.57.0",
    "huggingface-hub>=0.34.0,<1.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
]
draw_text = ["Pillow>=10.0.0"]
# & custom actions: $code (llama-cpp in base deps) + handler deps; no torch (keeps venv light).
custom_actions = [
    "pillow>=10.0.0",
    "numpy",
]
finetune = [
    "torch>=2.1",
    "transformers>=4.57.0",
    "accelerate>=1.0.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "trl>=0.12.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "gguf>=0.10.0",
]
video_thumbnailer = [
    "av>=12.0.0",
    "pymediainfo>=6.0.0",
    "Pillow>=10.0.0",
]
ocr = [
    "paddleocr>=2.7.3,<3",
    "paddlepaddle>=3.2.0,<3.3.0",
    "setuptools>=70.0.0",
]
image2text = [
    "torch==2.7.1",
    "torchvision",
    "transformers>=4.57.0",
    "accelerate>=1.0.0",
    "huggingface-hub>=0.34.0,<1.0",
    "pillow",
    "safetensors>=0.4.0",
]
image2embedding = [
    "torch==2.7.1",
    "torchvision",
    "transformers>=4.57.0",
    "accelerate>=1.0.0",
    "huggingface-hub>=0.34.0,<1.0",
    "pillow>=10.0.0",
    "numpy",
    "safetensors>=0.4.0",
]
text2embedding = [
    "torch==2.7.1",
    "torchvision",
    "transformers>=4.57.0",
    "accelerate>=1.0.0",
    "huggingface-hub>=0.34.0,<1.0",
    "pillow>=10.0.0",
    "numpy",
    "safetensors>=0.4.0",
]
video2embedding = [
    "torch==2.7.1",
    "torchvision",
    "transformers>=4.57.0",
    "accelerate>=1.0.0",
    "huggingface-hub>=0.34.0,<1.0",
    "pillow>=10.0.0",
    "numpy",
    "safetensors>=0.4.0",
    "opencv-python>=4.8.0",
]
split_video = [
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "imagehash>=4.3.0",
    "numpy",
]
split_video_fast = [
    "Pillow>=10.0.0",
    "imagehash>=4.3.0",
    "numpy",
]
video_index = [
    "faiss-cpu>=1.7.4",
    "numpy",
    "opencv-python>=4.8.0",
]
# Image + video in one session (example.ah @create_video):
media = [
    "torch==2.7.1",
    "torchvision",
    "torchaudio==2.7.1",
    "bitsandbytes>=0.43.0",
    "ftfy>=6.1",
    "sageattention>=1.0.6",
    "diffusers>=0.37.0",
    "transformers>=4.57.0",
    "huggingface-hub>=0.34.0,<1.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
    "compel>=2.0.0",
    "protobuf>=4.25.0",
    "sentencepiece>=0.2.0",
    "peft>=0.13.0",
    "opencv-python>=4.8.0",
    "moviepy>=2.0",
    "pillow>=10.0.0",
    "librosa>=0.10.0",
    # comfy_lib in-process ($image2image / $image2video)
    "torchsde",
    "scipy",
    "einops",
    "tqdm",
    "face-alignment>=1.4.1",
    "controlnet-aux>=0.0.9",
    "matplotlib>=3.8.0",
    "comfy-kitchen>=0.2.8",
    "imagehash>=4.3.0",
    "faiss-cpu>=1.7.4",
]
# Vendored ComfyUI-WanVideoWrapper + VideoHelperSuite under comfy_lib/ (optional worker venv).
# Sync with media:  uv sync --extra media --extra comfy-wan  (see .venvs/comfy-wan)
comfy-wan = [
    "pyloudnorm>=0.1.0",
    "gguf>=0.17.1",
    "imageio-ffmpeg>=0.5.0",
    "av>=12.0.0",
    # Keep sklearn/pandas wheels aligned with torch's numpy 2.x (avoids import mismatch).
    "numpy>=2.0,<2.3",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
]
#   tools\setup_external_venvs.ps1   (creates .venvs/media + .venvs/music; do not merge extras)
#   uv sync --extra media          (only inside UV_PROJECT_ENVIRONMENT=.venvs/media)
#   uv sync --extra image --extra image2video
#   uv sync --extra image2video   (CUDA torch 2.7.1+cu128 — NOT PyPI CPU torch)
#   If torch_cuda.dll fails: close all Python, then tools\setup_gpu_torch.ps1
#   uv pip install "ace-step @ git+https://github.com/ace-step/ACE-Step-1.5.git"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
ace-step = { git = "https://github.com/ace-step/ACE-Step-1.5.git" }

# ace-step pins torch 2.10+cu128; image/media use torch 2.7.1 - never install both extras in one env.
[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
conflicts = [
    [{ extra = "music" }, { extra = "media" }],
    [{ extra = "music" }, { extra = "image" }],
    [{ extra = "music" }, { extra = "image2video" }],
    [{ extra = "music" }, { extra = "image2video-fast" }],
    [{ extra = "music" }, { extra = "image2text" }],
    [{ extra = "music" }, { extra = "image2embedding" }],
    [{ extra = "music" }, { extra = "text2embedding" }],
    [{ extra = "music" }, { extra = "video2embedding" }],
    [{ extra = "music" }, { extra = "split_video" }],
    [{ extra = "music" }, { extra = "video_index" }],
    [{ extra = "music" }, { extra = "comfy-wan" }],
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
ah = "ahlib.run_ah:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ahlib", "externals"]

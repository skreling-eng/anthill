<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anthill Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      line-height: 1.4;
      background: #f5f7fb;
      font-size: 13px;
    }
    .root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .top {
      height: 60%;
      display: flex;
      min-height: 0;
    }
    .bottom {
      height: 40%;
      display: flex;
      min-height: 0;
    }
    .area {
      border: 1px solid #d3d9e3;
      background: #ffffff;
      margin: 2px;
      padding: 6px;
      overflow: auto;
    }
    .top-left {
      width: 40%;
      -webkit-user-select: text;
      user-select: text;
      cursor: text;
    }
    .top-left pre {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .top-left .json-fold {
      margin: 4px 0 0;
    }
    .top-left .json-fold summary {
      cursor: pointer;
      list-style-position: outside;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .top-left .json-fold summary code {
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      color: #333;
    }
    .top-left .json-fold pre {
      margin: 6px 0 0;
      padding: 6px;
      background: #f3f5f8;
      border: 1px solid #e2e6ee;
      border-radius: 4px;
      font-size: 12px;
    }
    .top-left .result-preview {
      margin: 6px 0;
    }
    .top-left .result-fold {
      margin: 4px 0;
      border: 1px solid #e2e6ee;
      border-radius: 4px;
      padding: 4px 6px;
      background: #fafbfc;
    }
    .top-left .result-fold summary {
      cursor: pointer;
      list-style-position: outside;
    }
    .top-left .result-title {
      font-weight: bold;
    }
    .top-left .result-preview-row {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      vertical-align: middle;
      margin-left: 4px;
      flex-wrap: wrap;
    }
    .top-left .result-list {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-start;
    }
    .top-left .result-thumb,
    .top-left .result-media {
      display: block;
      max-width: 100%;
      object-fit: contain;
      background: #eef1f5;
      border: 1px solid #d8dee8;
      border-radius: 3px;
    }
    .top-left .gallery-img {
      cursor: pointer;
    }
    .top-left .gallery-img:hover {
      border-color: #0066cc;
      box-shadow: 0 0 0 1px #0066cc;
    }
    .image-lightbox {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-lightbox.hidden {
      display: none;
    }
    .image-lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
    }
    .image-lightbox-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      padding: 0 48px;
    }
    .image-lightbox-img {
      display: block;
      max-width: min(92vw, 1200px);
      max-height: 88vh;
      object-fit: contain;
      background: #111;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    .image-lightbox-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 64px;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.92);
      color: #222;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      z-index: 2;
    }
    .image-lightbox-btn:hover {
      background: #fff;
    }
    .image-lightbox-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .image-lightbox-prev {
      left: 8px;
    }
    .image-lightbox-next {
      right: 8px;
    }
    .image-lightbox-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.92);
      color: #222;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      z-index: 3;
    }
    .image-lightbox-close:hover {
      background: #fff;
    }
    .image-lightbox-counter {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 13px;
      z-index: 3;
    }
    .top-left .result-list-sounds audio {
      min-width: 200px;
      max-width: 100%;
    }
    .top-left .result-text-item summary {
      white-space: normal;
    }
    .top-left .result-text-full {
      margin: 6px 0 0;
      padding: 6px;
      background: #f3f5f8;
      border: 1px solid #e2e6ee;
      border-radius: 4px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .top-left .result-missing {
      color: #888;
      font-style: italic;
    }
    .top-left .log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .top-left .copy-json-ref {
      flex-shrink: 0;
      font-size: 11px;
      color: #0066cc;
      text-decoration: none;
      white-space: nowrap;
      -webkit-user-select: none;
      user-select: none;
    }
    .top-left .copy-json-ref:hover {
      text-decoration: underline;
    }
    .top-right {
      width: 60%;
      -webkit-user-select: text;
      user-select: text;
    }
    .top-right .chat-text {
      margin: 8px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .top-right .chat-user {
      color: #1a4d8f;
    }
    .top-right .chat-bot {
      color: #222;
    }
    .top-right .chat-info {
      color: #555;
      font-size: 12px;
      margin: 4px 0;
    }
    .bottom-left {
      width: 40%;
      -webkit-user-select: text;
      user-select: text;
    }
    .bottom-left .chat-code {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
    }
    .bottom-right {
      width: 60%;
    }
  </style>
  <script>
    const counterValue = document.getElementById("counter-value");
    const lastIdValue = document.getElementById("last-id");
    const lastTypeValue = document.getElementById("last-type");

    // Listen to all clicks and process only link clicks.
    document.addEventListener("click", async (event) => {
      if (event.target.closest(".gallery-img, .image-lightbox")) {
        return;
      }
      if (event.target.closest("#chat-run, #chat-input, form")) {
        return;
      }

      const clickedLink = event.target.closest("a");
      if (!clickedLink) {
        return;
      }

      event.preventDefault();

      if (!window.pywebview || !window.pywebview.api) {
        return;
      }

      const linkId = clickedLink.id || "";
      const linkType = clickedLink.getAttribute("type") || "";
      const result = await window.pywebview.api.on_link_click(linkId, linkType);

      counterValue.textContent = String(result.counter);
      lastIdValue.textContent = String(result.id || "-");
      lastTypeValue.textContent = String(result.type || "-");

      //await window.pywebview.api.show_another_html();
    });
  </script>

  <script>
    function teardownMedia(root) {
      root.querySelectorAll("audio, video").forEach((el) => {
        try {
          el.pause();
        } catch (e) {
          /* ignore */
        }
        el.removeAttribute("src");
        el.load();
      });
    }

    function activateLazyMedia(container) {
      container.querySelectorAll("audio.lazy-media, video.lazy-media").forEach((el) => {
        const uri = el.getAttribute("data-src");
        if (!uri || el.getAttribute("src")) {
          return;
        }
        el.setAttribute("src", uri);
        el.load();
      });
    }

    function bindLazyMedia(root) {
      root.querySelectorAll("details.result-fold").forEach((details) => {
        if (details.dataset.lazyMediaBound === "1") {
          return;
        }
        details.dataset.lazyMediaBound = "1";
        details.addEventListener("toggle", () => {
          if (details.open) {
            activateLazyMedia(details);
          }
        });
      });
    }

    let _lastActionLogHtml = "";

    function setTemplateFragment(fragmentName, fragmentHTML) {
      const root = document.getElementById(fragmentName);
      if (fragmentName === "top-left") {
        if (fragmentHTML === _lastActionLogHtml) {
          return;
        }
        _lastActionLogHtml = fragmentHTML;
        teardownMedia(root);
      }
      root.innerHTML = fragmentHTML;
      if (fragmentName === "top-left") {
        bindLazyMedia(root);
      }
    }

    function setTemplateFragments(topLeft, topRight, bottomLeft, bottomRight) {
      document.getElementById("top-left").innerHTML = topLeft;
      document.getElementById("top-right").innerHTML = topRight;
      document.getElementById("bottom-left").innerHTML = bottomLeft;
      document.getElementById("bottom-right").innerHTML = bottomRight;
    }

    window.setTemplateFragments = setTemplateFragments;
    window.setTemplateFragment = setTemplateFragment;

    window.setChatInputEnabled = function (enabled) {
      var el = document.getElementById("chat-input");
      var btn = document.getElementById("chat-run");
      if (el) {
        el.disabled = !enabled;
      }
      if (btn) {
        if (enabled) {
          btn.classList.remove("disabled");
        } else {
          btn.classList.add("disabled");
        }
      }
      if (enabled && el) {
        el.focus();
      }
    };

    window.submitChatInput = function () {
      if (!window.pywebview || !window.pywebview.api) {
        return;
      }
      var el = document.getElementById("chat-input");
      var btn = document.getElementById("chat-run");
      if (!el || el.disabled || (btn && btn.classList.contains("disabled"))) {
        return;
      }
      var text = el.value || "";
      el.value = "";
      window.pywebview.api.submit_chat_input(text);
    };

    document.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" || !event.shiftKey) {
        return;
      }
      var el = document.getElementById("chat-input");
      var btn = document.getElementById("chat-run");
      if (
        !el ||
        document.activeElement !== el ||
        el.disabled ||
        !btn ||
        btn.classList.contains("disabled")
      ) {
        return;
      }
      event.preventDefault();
      window.submitChatInput();
    });

    (function () {
      async function refreshActionLog() {
        if (!window.pywebview || !window.pywebview.api || !window.pywebview.api.poll_log_refresh) {
          return;
        }
        try {
          const html = await window.pywebview.api.poll_log_refresh();
          if (typeof html === "string" && html.length > 0) {
            setTemplateFragment("top-left", html);
          }
        } catch (err) {
          /* ignore poll errors */
        }
      }
      window.setInterval(refreshActionLog, 400);
      window.addEventListener("load", refreshActionLog);
    })();

    (function () {
      async function refreshChatInput() {
        if (!window.pywebview || !window.pywebview.api || !window.pywebview.api.poll_chat_input_state) {
          return;
        }
        try {
          const enabled = await window.pywebview.api.poll_chat_input_state();
          if (enabled === true || enabled === false) {
            window.setChatInputEnabled(enabled);
          }
        } catch (err) {
          /* ignore poll errors */
        }
      }
      window.setInterval(refreshChatInput, 150);
      window.addEventListener("load", refreshChatInput);
    })();
  </script>

    <style>

<script>
document.addEventListener("keydown", (e) => {
  // only allow number keys 0-9
  if (!/^[0-9]$/.test(e.key)) return;
  // optional: ignore when typing in form fields
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
  var className = `link${e.key}`; // link1, link2, ... link0
  if (e.ctrlKey) className = className + 'ctrl';
  const els = document.getElementsByClassName(className);
  // click first matching element (or loop all if you want)
  if (els.length > 0) {
    els[0].click();
  }
});
</script>

</head>
<body>
  <div class="root">
    <div class="top">
      <section id="top-left" class="area top-left"></section>
      <section id="top-right" class="area top-right"></section>
    </div>
    <div class="bottom">
      <section id="bottom-left" class="area bottom-left"></section>
      <section id="bottom-right" class="area bottom-right"></section>
    </div>
  </div>

  <div id="image-lightbox" class="image-lightbox hidden" aria-hidden="true">
    <div class="image-lightbox-backdrop"></div>
    <button type="button" class="image-lightbox-close" title="Close">&times;</button>
    <div class="image-lightbox-content">
      <button type="button" class="image-lightbox-btn image-lightbox-prev" title="Previous">&#9664;</button>
      <img class="image-lightbox-img" src="" alt="">
      <button type="button" class="image-lightbox-btn image-lightbox-next" title="Next">&#9654;</button>
    </div>
    <div class="image-lightbox-counter"></div>
  </div>

  <script>
    (function () {
      function parseGalleryImages(gallery) {
        const raw = gallery.getAttribute("data-images") || "[]";
        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
        } catch (err) {
          return [];
        }
      }

      function initImageLightbox() {
        const lightbox = document.getElementById("image-lightbox");
        if (!lightbox) {
          return;
        }

        const lightboxImg = lightbox.querySelector(".image-lightbox-img");
        const lightboxCounter = lightbox.querySelector(".image-lightbox-counter");
        const btnPrev = lightbox.querySelector(".image-lightbox-prev");
        const btnNext = lightbox.querySelector(".image-lightbox-next");
        const btnClose = lightbox.querySelector(".image-lightbox-close");
        const backdrop = lightbox.querySelector(".image-lightbox-backdrop");

        let images = [];
        let index = 0;

        function showImage() {
          if (!images.length) {
            return;
          }
          lightboxImg.src = images[index];
          lightboxImg.alt = `Image ${index + 1} of ${images.length}`;
          lightboxCounter.textContent = `${index + 1} / ${images.length}`;
          btnPrev.disabled = index <= 0;
          btnNext.disabled = index >= images.length - 1;
        }

        function openLightbox(gallery, startIndex) {
          images = parseGalleryImages(gallery);
          if (!images.length) {
            return;
          }
          index = Math.max(0, Math.min(startIndex, images.length - 1));
          lightbox.classList.remove("hidden");
          lightbox.setAttribute("aria-hidden", "false");
          showImage();
        }

        function closeLightbox() {
          lightbox.classList.add("hidden");
          lightbox.setAttribute("aria-hidden", "true");
          lightboxImg.removeAttribute("src");
          images = [];
          index = 0;
        }

        function step(delta) {
          if (!images.length) {
            return;
          }
          const next = index + delta;
          if (next < 0 || next >= images.length) {
            return;
          }
          index = next;
          showImage();
        }

        document.addEventListener("click", (event) => {
          const thumb = event.target.closest(".gallery-img");
          if (thumb) {
            event.preventDefault();
            event.stopPropagation();
            const gallery = thumb.closest(".result-images");
            if (!gallery) {
              return;
            }
            const startIndex = parseInt(thumb.getAttribute("data-gallery-index") || "0", 10);
            openLightbox(gallery, Number.isNaN(startIndex) ? 0 : startIndex);
            return;
          }

          if (!lightbox.classList.contains("hidden")) {
            if (event.target === backdrop || event.target === btnClose) {
              closeLightbox();
              return;
            }
            if (event.target === btnPrev) {
              step(-1);
              return;
            }
            if (event.target === btnNext) {
              step(1);
            }
          }
        }, true);

        document.addEventListener("keydown", (event) => {
          if (lightbox.classList.contains("hidden")) {
            return;
          }
          if (event.key === "Escape") {
            closeLightbox();
          } else if (event.key === "ArrowLeft") {
            step(-1);
          } else if (event.key === "ArrowRight") {
            step(1);
          }
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initImageLightbox);
      } else {
        initImageLightbox();
      }
    })();
  </script>

</body>
